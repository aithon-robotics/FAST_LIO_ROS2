/**:
    ros__parameters:
        # No output_prefix set (unprefixed default, same as upstream mid360.yaml):
        # publishes /Odometry, /cloud_registered, frames 'camera_init'/'lidar'. See
        # atn_startup's state_estimation_livox_fastlio.launch.py for the static TFs
        # that hook these into base_link/odom.
        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

        preprocess:
            lidar_type: 4                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
            scan_line:  64
            blind: 2.0
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     200.0
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic,
            # IMU is co-located inside the MID360 — identity rotation, small translation.
            extrinsic_T: [ 0.05512, 0.02226, -0.0297 ]
            extrinsic_R: [ 1., 0., 0.,
                           0., 1., 0.,
                           0., 0., 1.]

        publish:
            path_en: false                # true: publish Path
            # Enabled (unlike upstream mid360.yaml) so this combo can feed
            # atn_map_accumulator: cloud_registered is what map_accumulator_node
            # subscribes to as its input_topic for this pipeline.
            scan_publish_en:  true
            dense_publish_en: true        # true: full-resolution deskewed points on cloud_registered
            scan_bodyframe_pub_en: false  # true: output the point cloud scans in IMU-body-frame

        # when you use docker, you should enter the absolute path of in docker container
        map_file_path: "/root/ros2_ws/src/FAST_LIO/PCD/result.pcd"
        pcd_save:
            pcd_save_en: false
            interval: -1                 # how many LiDAR frames saved in each pcd file;
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

        traj_save:
            traj_save_en: false
            traj_file_path: "/root/ros2_ws/src/FAST_LIO/traj/trajectory.txt" # when you use docker, you should enter the absolute path of in docker container
